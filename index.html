<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoPOS - Control de Restaurante</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 1rem; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--surface); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 1rem; }
        h1, h2 { color: var(--text); margin-bottom: 1rem; font-size: 1.5rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 0.5rem; }
        .btn:hover { background: var(--primary-dark); }
        .btn-secondary { background: #64748b; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem; }
        .menu-card { background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; transition: 0.2s; }
        .menu-card:active { transform: scale(0.98); }
        .menu-card h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
        .badge { background: #dbeafe; color: #1e40af; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 0.5rem; }
        .table-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 1rem; }
        .table-item { background: #f1f5f9; border: 2px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; font-weight: bold; }
        .table-item.ocupada { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
        .table-item.libre { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    </style>
</head>
<body>
    <div class="container">
        <!-- VISTA DE LOGIN -->
        <div id="login-view" class="card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2>RestoPOS</h2>
                <p style="color: var(--text-secondary);">Ingrese sus credenciales</p>
            </div>
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="userInput" placeholder="Ej: admin">
            </div>
            <div class="input-group">
                <label>Contraseña / PIN</label>
                <input type="password" id="passInput" placeholder="••••">
            </div>
            <button class="btn" onclick="login()">Iniciar Sesión</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary);">Usuario admin / PIN 123</p>
        </div>

        <!-- PANEL PRINCIPAL -->
        <div id="dashboard-view" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 id="welcome-msg" style="margin: 0; font-size: 1.2rem;">Panel</h2>
                <button class="btn btn-secondary" style="width: auto; padding: 0.5rem 1rem; margin: 0;" onclick="logout()">Salir</button>
            </div>
            
            <div class="grid">
                <div class="menu-card" onclick="showSection('tables-section')">
                    <h3>🪑 Mesas</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">Gestión de salón</p>
                </div>
                <div class="menu-card" onclick="showSection('catalog-section')">
                    <h3>🍔 Catálogo</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">Precios y productos</p>
                </div>
                <div class="menu-card" onclick="alert('Módulo disponible en la siguiente fase')">
                    <h3>📦 Inventario</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">Recetas y stock</p>
                </div>
                <div class="menu-card" onclick="alert('Módulo disponible en la siguiente fase')">
                    <h3>📊 Reportes</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">Caja y ventas</p>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: GESTIÓN DE MESAS -->
        <div id="tables-section" class="card hidden">
            <h2>Gestión de Mesas</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Seleccione una mesa para cambiar su estado:</p>
            <div class="table-grid" id="tableGridContainer">
                <!-- Generado por JS -->
            </div>
            <button class="btn btn-secondary" style="margin-top: 1.5rem;" onclick="showSection('dashboard-view')">Volver al Menú</button>
        </div>

        <!-- SECCIÓN: CATÁLOGO Y PRECIOS -->
        <div id="catalog-section" class="card hidden">
            <h2>Catálogo de Productos</h2>
            <div class="input-group">
                <label>Nuevo Producto</label>
                <input type="text" id="newProdName" placeholder="Ej: Hamburguesa Especial">
            </div>
            <div class="input-group">
                <label>Precio ($)</label>
                <input type="number" id="newProdPrice" placeholder="Ej: 25000">
            </div>
            <button class="btn" onclick="addProduct()">Agregar al Catálogo</button>
            
            <div style="margin-top: 1.5rem;">
                <h3>Productos Existentes</h3>
                <div id="productList" style="margin-top: 0.5rem; max-height: 200px; overflow-y: auto;">
                    <!-- Generado por JS -->
                </div>
            </div>
            <button class="btn btn-secondary" style="margin-top: 1.5rem;" onclick="showSection('dashboard-view')">Volver al Menú</button>
        </div>
    </div>

    <script>
        // Simulación de datos iniciales
        let tables = [
            { id: 1, name: 'Mesa 1', status: 'libre' },
            { id: 2, name: 'Mesa 2', status: 'ocupada' },
            { id: 3, name: 'Mesa 3', status: 'libre' },
            { id: 4, name: 'Mesa 4', status: 'libre' },
            { id: 5, name: 'Mesa 5', status: 'ocupada' },
            { id: 6, name: 'Mesa 6', status: 'libre' }
        ];

        let products = [
            { name: 'Hamburguesa Sencilla', price: 18000 },
            { name: 'Papas Francesas', price: 8000 },
            { name: 'Gaseosa 400ml', price: 4000 }
        ];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if(user === 'admin' && pass === '123') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = 'Administrador General';
            } else {
                alert('Credenciales incorrectas. Usa admin / 123');
            }
        }

        function logout() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function showSection(sectionId) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('tables-section').classList.add('hidden');
            document.getElementById('catalog-section').classList.add('hidden');
            
            document.getElementById(sectionId).classList.remove('hidden');
            if(sectionId === 'tables-section') renderTables();
            if(sectionId === 'catalog-section') renderProducts();
        }

        function renderTables() {
            const container = document.getElementById('tableGridContainer');
            container.innerHTML = '';
            tables.forEach(t => {
                const div = document.createElement('div');
                div.className = `table-item ${t.status}`;
                div.innerHTML = `${t.name}<br><span style="font-size:0.75rem; text-transform:uppercase;">${t.status}</span>`;
                div.onclick = () => toggleTableStatus(t.id);
                container.appendChild(div);
            });
        }

        function toggleTableStatus(id) {
            const table = tables.find(t => t.id === id);
            if(table) {
                table.status = table.status === 'libre' ? 'ocupada' : 'libre';
                renderTables();
            }
        }

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                const item = document.createElement('div');
                item.style.cssText = "display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);";
                item.innerHTML = `<span>${p.name}</span><strong>$ ${p.price.toLocaleString()}</strong>`;
                list.appendChild(item);
            });
        }

        function addProduct() {
            const name = document.getElementById('newProdName').value;
            const price = parseFloat(document.getElementById('newProdPrice').value);
            if(name && price) {
                products.push({ name, price });
                document.getElementById('newProdName').value = '';
                document.getElementById('newProdPrice').value = '';
                renderProducts();
                alert('Producto agregado con éxito');
            } else {
                alert('Por favor complete ambos campos');
            }
        }
    </script>
</body>
</html>
